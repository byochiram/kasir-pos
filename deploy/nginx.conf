# Salin ke /etc/nginx/sites-available/kasir, ganti server_name, lalu aktifkan.
# Blok listen 443 dan pengalihan HTTP ditambahkan otomatis oleh certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name kasir.domain-anda.com;

    # Unggahan pemulihan backup bisa besar; bawaan nginx hanya 1 MB.
    client_max_body_size 210M;

    # Aset ber-hash Next tidak pernah berubah isinya.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Dipakai aplikasi untuk rate limit login; tanpa ini semua request
        # terlihat berasal dari alamat yang sama.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
